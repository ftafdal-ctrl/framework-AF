name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-and-security-gates:
    name: Deterministic Quality & Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup PHP 8.2 Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql
          tools: composer:v2

      - name: 3. Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. PHP Syntax Linting
        run: |
          if [ -d "app" ] || [ -d "public" ]; then
            echo "Memeriksa sintaks PHP..."
            find app/ public/ -type f -name "*.php" -print0 2>/dev/null | xargs -0 -r -n1 php -l
          else
            echo "Direktori app/ atau public/ belum ada, melewati linting sintaks."
          fi

      - name: 5. Install Dependencies via Composer
        run: |
          if [ -f "composer.json" ]; then
            echo "Memvalidasi struktur composer.json..."
            composer validate --strict --no-check-all
            echo "Menginstal paket dependensi dan membuat lockfile..."
            composer install --prefer-dist --no-progress --no-interaction
          else
            echo "composer.json belum ada di repositori. Melewati instalasi dependensi."
          fi

      - name: 6. Audit Dependensi Komposer (Vulnerabilities Scan)
        run: |
          if [ -f "composer.lock" ]; then
            echo "composer.lock ditemukan. Menjalankan composer audit..."
            composer audit
          elif [ -f "composer.json" ]; then
            echo "Menjalankan composer audit langsung dari composer.json..."
            composer audit || true
          else
            echo "composer.lock / composer.json belum ada di repositori. Melewati audit dependensi."
          fi

      - name: 7. Static Application Security Testing (PHPStan Level 6)
        run: |
          if [ -f "vendor/bin/phpstan" ] && [ -d "app" ]; then
            echo "Menjalankan PHPStan Level 6..."
            vendor/bin/phpstan analyse -c phpstan.neon
          else
            echo "PHPStan atau folder app belum siap. Melewati analisis statis."
          fi

      - name: 8. Automated Unit & Security Test Suites (PHPUnit)
        run: |
          if [ -f "vendor/bin/phpunit" ] && [ -d "tests" ]; then
            echo "Menjalankan pengujian otomatis PHPUnit..."
            vendor/bin/phpunit --testdox
          else
            echo "PHPUnit atau folder tests belum siap. Melewati test suite."
          fi
